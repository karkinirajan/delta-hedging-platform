[project]
name = "delta-hedging"
version = "0.1.0"
description = "Delta hedging of option positions on the IG demo API: Black-Scholes greeks, a hedge recommendation from the portfolio's net delta, and a guarded, authenticated API with a dashboard."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1",
    "httpx>=0.28",
    "python-dotenv>=1.1",
    "gunicorn>=23",
]

[project.scripts]
delta-hedging = "delta_hedging.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/delta_hedging"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["delta_hedging"]
branch = true

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
